name: GitHub Pages fallback (manual)

# The site's home is Vercel (https://flash-accounting-landing-page.vercel.app),
# which deploys every push to main by itself. This workflow no longer runs on push.
#
# The GitHub Pages copy at https://zii144.github.io/flash-accounting-landing-page/
# stays published because shipped links still point at it: app build 19's in-app
# Privacy Policy / Terms of Use links and the App Store metadata live at the time
# of the move (2026-10-03). Its canonical URLs point at Vercel, so search engines
# treat it as a mirror. Run it by hand only to refresh that mirror, and retire it
# (Settings → Pages → Unpublish) once no shipped build or store listing links here.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Canonical URLs point at the Vercel home, not at this mirror.
  NEXT_PUBLIC_SITE_URL: https://flash-accounting-landing-page.vercel.app
  NEXT_PUBLIC_BASE_PATH: /flash-accounting-landing-page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
